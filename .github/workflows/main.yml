name: Compiling workflow

on:
  push:
    branches: 
      - '536-run-number-occasionally-not-increasing'
    tags:
      - '*'
    paths-ignore:
      - 'release_notes'
      - '**.md'
      - '**/README'
      - '**/NEWS'
      - '**/AUTHORS'
      - '**/COPYING'
      - '**/INSTALL'
      - '**/ChangeLog'

jobs:
  bookworm:
    uses: ./.github/workflows/build.yml
    with:
      os-version: bookworm
      packaging: true
      dist-packaging: ${{ startsWith(github.ref, 'refs/tags') }}
    secrets: inherit
  bookworm-cmake:
    uses: ./.github/workflows/build-cmake.yml
    with:
      os-version: bookworm
      packaging: true
      dist-packaging: ${{ startsWith(github.ref, 'refs/tags') }}
    secrets: inherit
  release:
    if: ${{ startsWith(github.ref, 'refs/tags') }}
    needs: [bookworm, bookworm-cmake]
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
