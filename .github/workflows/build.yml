name: Build (and packaging)

on:
  workflow_call:
    inputs:
      os-version:
        required: true
        type: string
      packaging:
        required: true
        type: boolean
      dist-packaging:
        default: false
        type: boolean

jobs:
  build-and-packaging:
    name: Build (and packaging)
    runs-on: ubuntu-latest
    container:
      image: fribdaq/frib-${{ inputs.os-version }}-ci
      options: --cpus 2
    steps:
      - uses: actions/checkout@v6
      - name: autoreconf
        working-directory: ./main
        run: autoreconf -if
      - name: Configure libtcl++
        env:
          GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"
        working-directory: ./main
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          eval `ssh-agent -s`
          
          echo "${{ secrets.LIBTCLPLUS }}" | ssh-add -
          ./tcl++incorp
          ssh-add -D
          
          eval `ssh-agent -k`
      - name: Incorporate unified format
        env:
          GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"
        working-directory: ./main
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          eval `ssh-agent -s`
          
          echo "${{ secrets.UNIFIEDFMT }}" | ssh-add -
          ./unifiedfmt-incorp.sh
          ssh-add -D
          
          eval `ssh-agent -k`
      - name: Incorporate DDAS format
        env:
          GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"
        working-directory: ./main
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          eval `ssh-agent -s`
          
          echo "${{ secrets.DDASFMT }}" | ssh-add -
          ./ddasfmt-incorp.sh
          ssh-add -D
          
          eval `ssh-agent -k`          
      - name: Creating build directory
        run: mkdir main/oot
      - name: Configuring
        working-directory: ./main/oot
        shell: bash
        run: |
          ../configure --prefix=/usr/opt/nscldaq/$GITHUB_REF_NAME \
                       --enable-usb=yes \
                       --enable-caen-digitizer-support \
                       --enable-docs \
                       --enable-epics-tools=yes \
                       --with-caen-digitizer-libroot=`cat /usr/opt/CAENDIGITIZERLIBS_PATH` \
                       --with-epics-rootdir=`cat /usr/opt/EPICS_PATH` \
                       --enable-ddas=yes \
                       --enable-ddas-docs=yes \
                       --with-incorp-build-cores=2 \
                       --with-xiaapidir=`cat /usr/opt/XIAAPI_PATH` \
                       --with-firmwaredir=`cat /usr/opt/DDASFIRMWARE_PATH-12.2` \
                       --with-rootsys=`cat /usr/opt/ROOT_PATH` \
                       --enable-mvlc-stack-generator \
                       --with-mvlcdir=`cat /usr/opt/MESYTECMVLC_PATH` \
                       --enable-rust-tools \
                       CXX=`cat /usr/opt/MPI_PATH`
      - name: Make
        working-directory: ./main/oot
        shell: bash
        run: |
          make -j2 clean && make -j2 all && make -j2 install
      - name: Make check
        id: make-check
        working-directory: ./main/oot
        shell: bash
        run : |
          source /usr/cargo/env
          rustup default stable
          cargo install portman
          sleep 2
          nohup portman > /dev/null 2>&1 &
          nohup nscldaq_ringmaster -l /tmp/ringmaster.log >> /tmp/ringmaster.log 2>&1 &
          VERBOSE=1 xvfb-run -a make check
      - name: Show portman and ringmaster logs on unittest failure
        if: always() && steps.make-check.outcome == 'failure'
        run: |
          echo "=== Portman log: ==="
          cat /tmp/portman.log
          [ -f /tmp/portman.log ] && cat /tmp/portman.log || echo "(not created)"
          echo "=== Ringmaster log: ==="
          cat /tmp/ringmaster.log
          [ -f /tmp/ringmaster.log ] && cat /tmp/ringmaster.log || echo "(not created)"
      - name: Checking disk space
        working-directory: ./main/oot
        run: |
          df
          df -h
      - name: Packaging for complete source distribution
        if: ${{ inputs.packaging == true && inputs.dist-packaging == true}}
        working-directory: ./main/oot
        run: |
          make -j2 dist
          mv nscldaq-${{ github.ref_name }}.tar.gz nscldaq-${{ github.ref_name }}-dist-${{ inputs.os-version }}.tar.gz
      - name: Complete source distribution package
        if: ${{ inputs.packaging == true && inputs.dist-packaging == true}}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.os-version }} complete source distribution
          path: ./main/oot/nscldaq-${{ github.ref_name }}-dist-${{ inputs.os-version }}.tar.gz
      - name: Packaging for binary distribution
        if: ${{ inputs.packaging == true }}
        working-directory: /usr/opt/nscldaq
        run: tar -czf nscldaq-$GITHUB_REF_NAME-${{ inputs.os-version }}.tar.gz $GITHUB_REF_NAME
      - name: Upload binary distribution package
        if: ${{ inputs.packaging == true }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.os-version }} binary distribution
          path: /usr/opt/nscldaq/nscldaq-${{ github.ref_name }}-${{ inputs.os-version }}.tar.gz
      - name: Packaging usropt for distribution
        if: ${{ inputs.packaging == true }}
        working-directory: /usr/opt
        run: tar -czf usropt-nscldaq-${{ github.ref_name }}-${{ inputs.os-version }}.tar.gz opt-${{ inputs.os-version }}
      - name: Upload usropt distribution package
        if: ${{ inputs.packaging == true }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.os-version }} usropt distribution
          path: /usr/opt/usropt-nscldaq-${{ github.ref_name }}-${{ inputs.os-version }}.tar.gz
